# Use the current AeroSpace configuration behavior
config-version = 2

# Start automatically when logging into macOS
start-at-login = true

# Apply changes whenever this file is saved
auto-reload-config = true

# Elke monitor krijgt een eigen, unieke workspace-reeks. AeroSpace deelt één
# pool tussen alle monitoren, dus dezelfde workspace-naam kan niet op twee
# schermen tegelijk zichtbaar zijn. SketchyBar toont beide reeksen wel als
# eenvoudig 1 t/m 6.
persistent-workspaces = [
  "main-1", "main-2", "main-3", "main-4", "main-5", "main-6",
  "side-1", "side-2", "side-3",
]

# New workspaces start with tiled windows.
# On a wide screen, windows are initially arranged side by side.
default-root-container-layout = "tiles"
default-root-container-orientation = "auto"

# Leave part of inactive windows visible in accordion layout
accordion-padding = 100

# -------------------------------------------------------------------
# Automatic app placement
#
# These rules only run when a new window is created.
# Afterwards, every window can still be moved manually.
# -------------------------------------------------------------------

on-window-detected = [
  # Werk de workspace-iconen bij nadat AeroSpace het nieuwe venster heeft
  # geregistreerd en eventuele plaatsingsregels hieronder zijn uitgevoerd.
  { check-further-callbacks = true, run = 'exec-and-forget /bin/bash -c "sleep 0.1; sketchybar --trigger aerospace_workspace_change"' },

  # Web and research
  { if = "test %{app-bundle-id} = com.apple.Safari", run = "move-node-to-workspace main-2" },
  { if = "test %{app-bundle-id} = com.google.Chrome", run = "move-node-to-workspace main-2" },
  { if = "test %{app-bundle-id} = com.openai.codex", run = "move-node-to-workspace main-2" },

  # Development
  { if = "test %{app-bundle-id} = com.microsoft.VSCode", run = "move-node-to-workspace main-3" },

  # Terminal
  { if = "test %{app-bundle-id} = com.github.wez.wezterm", run = "move-node-to-workspace main-4" },

  # File management
  { if = "test %{app-bundle-id} = com.binarynights.ForkLift", run = "move-node-to-workspace main-5" },

  # Communication
  { if = "test %{app-bundle-id} = net.whatsapp.WhatsApp", run = "move-node-to-workspace main-6" },
  { if = "test %{app-bundle-id} = com.apple.MobileSMS", run = "move-node-to-workspace main-6" },
  { if = "test %{app-bundle-id} = com.microsoft.Outlook", run = "move-node-to-workspace main-6" },
  { if = "test %{app-bundle-id} = com.microsoft.teams2", run = "move-node-to-workspace main-6" },
]

# Keep SketchyBar in sync with the active workspace
exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  'sleep 0.1; sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE; sketchybar --trigger aerospace_focus_change',
]

# Laat de korte vertraging eerst verlopen, zodat een geopend of gesloten
# venster al in de AeroSpace-snapshot is verwerkt voordat SketchyBar ververst.
on-focus-changed = [
  'exec-and-forget /bin/bash -c "sleep 0.1; sketchybar --trigger aerospace_workspace_change; sketchybar --trigger aerospace_focus_change"',
]

# Het hoofdscherm en het tweede scherm krijgen allebei 1 t/m 6. Bij één monitor
# valt side-* terug op main, zodat dezelfde configuratie bruikbaar blijft.
[workspace-to-monitor-force-assignment]
main-1 = "main"
main-2 = "main"
main-3 = "main"
main-4 = "main"
main-5 = "main"
main-6 = "main"
side-1 = ["secondary", "main"]
side-2 = ["secondary", "main"]
side-3 = ["secondary", "main"]

# Small gaps make separate windows easier to recognize
[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 10
outer.bottom = 10
outer.top = 10
outer.right = 10

[mode.main.binding]

# Open a persistent service mode for grouping and layout maintenance.
# SketchyBar shows clearly that normal bindings are temporarily inactive.
alt-shift-semicolon = [
  "exec-and-forget /bin/bash -lc '$HOME/.local/bin/aerospace-service-mode enter'",
  "mode service",
]

# ------------------------------------------------------------
# Focus
# Select the nearest window without moving anything.
# ------------------------------------------------------------

alt-h = "focus left"
alt-j = "focus down"
alt-k = "focus up"
alt-l = "focus right"

# ------------------------------------------------------------
# Move
# Change the position of the focused window in the layout.
# ------------------------------------------------------------

alt-shift-h = "move left"
alt-shift-j = "move down"
alt-shift-k = "move up"
alt-shift-l = "move right"

# Cycle through all windows in the current workspace
alt-leftSquareBracket = "focus dfs-prev"
alt-rightSquareBracket = "focus dfs-next"

# ------------------------------------------------------------
# Layout
# ------------------------------------------------------------

# Temporarily maximize the focused window; press again to restore
alt-m = "fullscreen --no-outer-gaps"

# Toggle SketchyBar to access the native macOS menu bar when needed.
ctrl-alt-space = "exec-and-forget /bin/bash -lc '$HOME/.local/bin/toggle-sketchybar-menu'"

# Let an exceptional window float, or return it to tiling
alt-shift-space = "layout floating tiling"

# Switch tiled windows between horizontal and vertical placement
alt-slash = "layout tiles horizontal vertical"

# Switch between equal tiles and one prominent accordion window
alt-a = "layout accordion tiles"

# Restore equal window sizes
alt-b = "balance-sizes"

# Make the focused tiled window smaller or larger
alt-minus = "resize smart -50"
alt-equal = "resize smart +50"

# ------------------------------------------------------------
# Workspaces
# Switch to a workspace.
# ------------------------------------------------------------

alt-1 = "exec-and-forget /bin/bash -lc '$HOME/.local/bin/aerospace-workspace-on-focused-monitor 1'"
alt-2 = "exec-and-forget /bin/bash -lc '$HOME/.local/bin/aerospace-workspace-on-focused-monitor 2'"
alt-3 = "exec-and-forget /bin/bash -lc '$HOME/.local/bin/aerospace-workspace-on-focused-monitor 3'"
alt-4 = "exec-and-forget /bin/bash -lc '$HOME/.local/bin/aerospace-workspace-on-focused-monitor 4'"
alt-5 = "exec-and-forget /bin/bash -lc '$HOME/.local/bin/aerospace-workspace-on-focused-monitor 5'"
alt-6 = "exec-and-forget /bin/bash -lc '$HOME/.local/bin/aerospace-workspace-on-focused-monitor 6'"

# Move only the focused window to another workspace
alt-shift-1 = "exec-and-forget /bin/bash -lc '$HOME/.local/bin/aerospace-move-to-workspace-on-focused-monitor 1'"
alt-shift-2 = "exec-and-forget /bin/bash -lc '$HOME/.local/bin/aerospace-move-to-workspace-on-focused-monitor 2'"
alt-shift-3 = "exec-and-forget /bin/bash -lc '$HOME/.local/bin/aerospace-move-to-workspace-on-focused-monitor 3'"
alt-shift-4 = "exec-and-forget /bin/bash -lc '$HOME/.local/bin/aerospace-move-to-workspace-on-focused-monitor 4'"
alt-shift-5 = "exec-and-forget /bin/bash -lc '$HOME/.local/bin/aerospace-move-to-workspace-on-focused-monitor 5'"
alt-shift-6 = "exec-and-forget /bin/bash -lc '$HOME/.local/bin/aerospace-move-to-workspace-on-focused-monitor 6'"

# Cycle through all workspaces
alt-tab = "workspace --wrap-around next"
alt-shift-tab = "workspace --wrap-around prev"

# Quickly toggle between the current and previous workspace
alt-backtick = "workspace-back-and-forth"

# ------------------------------------------------------------
# Multiple monitors
# ------------------------------------------------------------

# Focus the next monitor
alt-period = "focus-monitor --wrap-around next"

# Move the focused window to the next monitor and follow it
alt-shift-period = "move-node-to-monitor --focus-follows-window --wrap-around next"

# ------------------------------------------------------------
# Service mode
#
# Enter with Option+Shift+semicolon. Unlike AeroSpace's sample config, this
# mode stays active so several layout operations can be performed in a row.
# Escape returns to main mode and reloads the configuration.
# ------------------------------------------------------------

[mode.service.binding]

esc = [
  "exec-and-forget /bin/bash -lc '$HOME/.local/bin/aerospace-service-mode exit'",
  "mode main",
  "reload-config",
]

# Group the focused window with its neighbour. Both the short keys and the
# familiar move chords work while service mode is active.
h = "join-with left"
j = "join-with down"
k = "join-with up"
l = "join-with right"
alt-shift-h = "join-with left"
alt-shift-j = "join-with down"
alt-shift-k = "join-with up"
alt-shift-l = "join-with right"

# Layout maintenance; service mode deliberately remains active.
r = "flatten-workspace-tree"
b = "balance-sizes"
f = "layout floating tiling"
a = "layout accordion tiles"
slash = "layout horizontal vertical"
m = "fullscreen --no-outer-gaps"

# Navigate while inspecting or adjusting a nested layout.
leftSquareBracket = "focus dfs-prev"
rightSquareBracket = "focus dfs-next"
