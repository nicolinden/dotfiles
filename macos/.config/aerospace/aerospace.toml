# Use the current AeroSpace configuration behavior
config-version = 2

# Start automatically when logging into macOS
start-at-login = true

# Apply changes whenever this file is saved
auto-reload-config = true

# Vaste workspaces per scherm, van links naar rechts.
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "Z", "X", "C", "V", "B"]

# Browsers share one wide accordion workspace by default.
after-startup-command = ['layout --workspace 2 --root h_accordion']

# New workspaces start with tiled windows.
# On a wide screen, windows are initially arranged side by side.
default-root-container-layout = "tiles"
default-root-container-orientation = "auto"

# Leave part of inactive windows visible in accordion layout
accordion-padding = 60

# -------------------------------------------------------------------
# New window handling
#
# Apps are not assigned to specific workspaces.
# Move windows manually using the workspace shortcuts.
# -------------------------------------------------------------------

on-window-detected = [
  # Open Finder windows floating instead of adding them to the tiled layout.
  { if = "test %{app-bundle-id} = com.apple.finder", run = "layout floating" },
  { if = "test %{app-bundle-id} = com.apple.Preview", run = "layout floating" },
  { if = "test %{app-bundle-id} = com.apple.Passwords", run = "layout floating" },
  { if = "test %{app-bundle-id} = com.1password.1password", run = "layout floating" },
  # Apple Terminal is for quick commands; WezTerm keeps its tiled layout.
  { if = "test %{app-bundle-id} = com.apple.Terminal", run = "layout floating" },

  # Keep Citrix sessions at their chosen size and monitor. Floating prevents
  # newly opened tiled windows from changing the VDI window resolution.
  { if = "test %{app-bundle-id} = com.citrix.receiver.icaviewer.mac", run = "layout floating" },

  # Automatic workspace assignments disabled; uncomment to enable.
  # Web and research
  # { if = "test %{app-bundle-id} = com.apple.Safari", run = "move-node-to-workspace 2" },
  # { if = "test %{app-bundle-id} = com.google.Chrome", run = "move-node-to-workspace 2" },

  # Development
  # { if = "test %{app-bundle-id} = com.microsoft.VSCode", run = "move-node-to-workspace 1" },

  # Terminal
  # { if = "test %{app-bundle-id} = com.github.wez.wezterm", run = "move-node-to-workspace 3" },
  # { if = "test %{app-bundle-id} = com.apple.Terminal", run = "move-node-to-workspace 3" },

  # File management
  # { if = "test %{app-bundle-id} = com.binarynights.ForkLift", run = "move-node-to-workspace 4" },
  # { if = "test %{app-bundle-id} = com.apple.finder", run = "move-node-to-workspace 4" },
  # { if = "test %{app-bundle-id} = com.openai.codex", run = "move-node-to-workspace 4" },

  # Communication
  # { if = "test %{app-bundle-id} = com.microsoft.Outlook", run = "move-node-to-workspace 6" },
  # { if = "test %{app-bundle-id} = com.microsoft.teams2", run = "move-node-to-workspace 6" },
  # { if = "test %{app-bundle-id} = net.whatsapp.WhatsApp", run = "move-node-to-workspace 6" },
]

# Open: 1-5 op het MacBook-scherm, 6-9 op het linker externe scherm,
# Z/X/C/V/B op het rechter externe scherm.
# Dicht: 1-5 links, 6-9 rechts (mits links de hoofdmonitor wordt).
# Bij twee schermen is 'secondary' de niet-hoofdmonitor; bij drie schermen
# valt 6-9 terug op het linkse scherm (monitor 1).
[workspace-to-monitor-force-assignment]
1 = ["built-in", 1]
2 = ["built-in", 1]
3 = ["built-in", 1]
4 = ["built-in", 1]
5 = ["built-in", 1]
6 = ["secondary", 1]
7 = ["secondary", 1]
8 = ["secondary", 1]
9 = ["secondary", 1]
Z = [3, 2, 1]
X = [3, 2, 1]
C = [3, 2, 1]
V = [3, 2, 1]
B = [3, 2, 1]

# Small gaps make separate windows easier to recognize
[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 10
outer.bottom = 10
outer.top = 10
outer.right = 10

[mode.main.binding]

# Open a persistent service mode for grouping and layout maintenance.
alt-shift-semicolon = "mode service"

# ------------------------------------------------------------
# Focus
# Select the nearest window without moving anything.
# ------------------------------------------------------------

alt-h = "focus left"
alt-j = "focus down"
alt-k = "focus up"
alt-l = "focus right"

# ------------------------------------------------------------
# Move
# Change the position of the focused window in the layout.
# ------------------------------------------------------------

alt-shift-h = "move left"
alt-shift-j = "move down"
alt-shift-k = "move up"
alt-shift-l = "move right"

# Cycle through all windows in the current workspace
alt-leftSquareBracket = "focus dfs-prev"
alt-rightSquareBracket = "focus dfs-next"

# ------------------------------------------------------------
# Layout
# ------------------------------------------------------------

# Temporarily maximize the focused window; press again to restore.
# Keep the configured outer gaps; add --no-outer-gaps to fill the screen edge to edge.
alt-m = "fullscreen"

# Let an exceptional window float, or return it to tiling
alt-shift-space = "layout floating tiling"

# Switch tiled windows between horizontal and vertical placement
alt-slash = "layout tiles horizontal vertical"

# Switch between equal tiles and one prominent accordion window
alt-a = "layout accordion tiles"

# Make the focused tiled window smaller or larger
alt-minus = "resize smart -50"
alt-equal = "resize smart +50"

# ------------------------------------------------------------
# Workspaces
# Switch to a workspace.
# ------------------------------------------------------------

alt-1 = "workspace 1"
alt-2 = "workspace 2"
alt-3 = "workspace 3"
alt-4 = "workspace 4"
alt-5 = "workspace 5"
alt-6 = "workspace 6"
alt-7 = "workspace 7"
alt-8 = "workspace 8"
alt-9 = "workspace 9"
alt-z = "workspace Z"
alt-x = "workspace X"
alt-c = "workspace C"
alt-v = "workspace V"
alt-b = "workspace B"

# Move only the focused window to another workspace
alt-shift-1 = "move-node-to-workspace --focus-follows-window 1"
alt-shift-2 = "move-node-to-workspace --focus-follows-window 2"
alt-shift-3 = "move-node-to-workspace --focus-follows-window 3"
alt-shift-4 = "move-node-to-workspace --focus-follows-window 4"
alt-shift-5 = "move-node-to-workspace --focus-follows-window 5"
alt-shift-6 = "move-node-to-workspace --focus-follows-window 6"
alt-shift-7 = "move-node-to-workspace --focus-follows-window 7"
alt-shift-8 = "move-node-to-workspace --focus-follows-window 8"
alt-shift-9 = "move-node-to-workspace --focus-follows-window 9"
alt-shift-z = "move-node-to-workspace --focus-follows-window Z"
alt-shift-x = "move-node-to-workspace --focus-follows-window X"
alt-shift-c = "move-node-to-workspace --focus-follows-window C"
alt-shift-v = "move-node-to-workspace --focus-follows-window V"
alt-shift-b = "move-node-to-workspace --focus-follows-window B"

# Cycle through all workspaces
alt-tab = "list-workspaces --monitor focused --empty no | workspace --stdin --wrap-around next"
alt-shift-tab = "list-workspaces --monitor focused --empty no | workspace --stdin --wrap-around prev"

# Quickly toggle between the current and previous workspace
alt-backtick = "workspace-back-and-forth"

# ------------------------------------------------------------
# Multiple monitors
# ------------------------------------------------------------

# Focus the next monitor
alt-period = "focus-monitor --wrap-around next"

# Move the focused window to the next monitor and follow it
alt-shift-period = "move-node-to-monitor --focus-follows-window --wrap-around next"

# ------------------------------------------------------------
# Service mode
#
# Enter with Option+Shift+semicolon. Unlike AeroSpace's sample config, this
# mode stays active so several layout operations can be performed in a row.
# Escape returns to main mode.
# ------------------------------------------------------------

[mode.service.binding]

esc = "mode main"

# Group the focused window with its neighbour. Both the short keys and the
# familiar move chords work while service mode is active.
h = "join-with left"
j = "join-with down"
k = "join-with up"
l = "join-with right"
alt-shift-h = "join-with left"
alt-shift-j = "join-with down"
alt-shift-k = "join-with up"
alt-shift-l = "join-with right"

# Layout maintenance; service mode deliberately remains active.
r = "flatten-workspace-tree"
b = "balance-sizes"
f = "layout floating tiling"
a = "layout accordion tiles"
slash = "layout horizontal vertical"
# Same padded fullscreen as alt-m; add --no-outer-gaps to remove the outer gaps.
m = "fullscreen"

# Navigate while inspecting or adjusting a nested layout.
leftSquareBracket = "focus dfs-prev"
rightSquareBracket = "focus dfs-next"
