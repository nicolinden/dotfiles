# Apps that may install privileged helpers and therefore stay outside Brewfiles.
SYSTEM_CASKS=(
  "docker-desktop"
)

SYSTEM_LABELS=(
  "Docker Desktop (privileged helper)"
)

system_apps_summary() {
  local separator="" label
  for label in "${SYSTEM_LABELS[@]}"; do
    printf '%s%s' "$separator" "$label"
    separator=", "
  done
}
