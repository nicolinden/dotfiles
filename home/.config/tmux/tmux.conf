# Modern colours inside tmux
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Use Ctrl+A as the tmux prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Responsive Escape key for Neovim
set -sg escape-time 10

# Mouse support
set -g mouse on

# Open windows and panes in the current directory
bind c new-window -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Toggle zoom for the active pane
bind m resize-pane -Z

# Full-client Matrix screensaver. Existing panes keep running underneath it.
# Enable the idle timer only when the optional development tool is installed.
set -g lock-command 'exec cmatrix -b -s'
if-shell 'command -v cmatrix >/dev/null 2>&1' \
  'set -g lock-after-time 900' \
  'set -g lock-after-time 0'
bind M if-shell 'command -v cmatrix >/dev/null 2>&1' \
  'lock-client' \
  'display-message "cmatrix is not installed (install the development profile)"'

# Vi-style copy mode with system clipboard support
set -g mode-keys vi
set -g set-clipboard on

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Minimal Coolnight status bar
set -g status-position bottom
set -g status-style "bg=#011423,fg=#CBE0F0"

set -g status-left-length 30
set -g status-left "#[bg=#24EAF7,fg=#011423,bold] #S #[bg=#011423]"

set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bg=#A277FF,fg=#011423,bold] #I:#W #[bg=#011423]"

set -g status-right "#[fg=#CBE0F0]%H:%M "

# Reload this configuration
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"
